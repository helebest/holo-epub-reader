[project]
name = "holo-epub-reader"
version = "0.3.0"
description = "EPUB reader skill that extracts text and images into LLM-friendly blocks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "holo" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=90"
